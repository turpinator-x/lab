# Exercise 5: Add a Linux Host
# A topology that mixes a network OS with a regular Linux container.

name: mixed-top

topology:
  nodes:
    # SR Linux router (network OS)
    router:
      kind: srl
      image: ghcr.io/nokia/srlinux:24.10.1

    # Alpine Linux host (regular Linux container)
    host1:
      kind: linux
      image: alpine:3.20

  links:
    # Connect router ethernet-1/1 (e1-1) to host1 eth1
    - endpoints: ["router:e1-1", "host1:eth1"]
