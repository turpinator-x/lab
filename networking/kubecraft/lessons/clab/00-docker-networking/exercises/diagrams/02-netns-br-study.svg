<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Lesson 00: Hand-built network with namespaces (red + blue on br-study)</text>

  <!-- Host -->
  <rect x="30" y="56" width="1140" height="680" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="50" y="84" font-size="16" font-weight="bold" fill="#334155">Host: Stealth-17Studio-A13VG (root network namespace) · no Docker, just ip netns</text>

  <!-- red namespace -->
  <rect x="110" y="104" width="380" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="132" font-size="16" font-weight="bold" fill="#b91c1c">red network namespace</text>
  <rect x="200" y="148" width="200" height="56" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="300" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">veth-r  (#16)</text>
  <text x="300" y="192" text-anchor="middle" font-size="13" fill="#111827">10.0.0.1/24</text>
  <text x="130" y="228" font-size="12" fill="#374151">lo UP (127.0.0.1)</text>
  <text x="130" y="248" font-size="12" fill="#374151">default via 10.0.0.254</text>

  <!-- blue namespace -->
  <rect x="710" y="104" width="380" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="132" font-size="16" font-weight="bold" fill="#1d4ed8">blue network namespace</text>
  <rect x="800" y="148" width="200" height="56" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="900" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">veth-b  (#18)</text>
  <text x="900" y="192" text-anchor="middle" font-size="13" fill="#111827">10.0.0.2/24</text>
  <text x="730" y="228" font-size="12" fill="#374151">lo UP (127.0.0.1)</text>
  <text x="730" y="248" font-size="12" fill="#374151">default via 10.0.0.254</text>

  <!-- veth pairs -->
  <line x1="300" y1="204" x2="300" y2="318" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 5"/>
  <line x1="900" y1="204" x2="900" y2="318" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 5"/>
  <text x="312" y="300" font-size="12" fill="#6d28d9">veth pair ("virtual cable")</text>
  <text x="912" y="300" font-size="12" fill="#6d28d9">veth pair ("virtual cable")</text>

  <rect x="200" y="318" width="200" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">veth-r-br@if16</text>
  <text x="300" y="358" text-anchor="middle" font-size="12" fill="#374151">host ifindex #15</text>

  <rect x="800" y="318" width="200" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="900" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">veth-b-br@if18</text>
  <text x="900" y="358" text-anchor="middle" font-size="12" fill="#374151">host ifindex #17</text>

  <line x1="300" y1="366" x2="300" y2="400" stroke="#7c3aed" stroke-width="3"/>
  <line x1="900" y1="366" x2="900" y2="400" stroke="#7c3aed" stroke-width="3"/>

  <!-- br-study -->
  <rect x="110" y="400" width="980" height="74" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="600" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">br-study  (Linux bridge, #14)</text>
  <text x="600" y="456" text-anchor="middle" font-size="13" fill="#065f46">10.0.0.254/24 (gateway)  ·  MAC 9e:40:ef:00:93:5a  ·  red ↔ blue switched here at layer 2 (ping ~0.03 ms)</text>

  <!-- forwarding + NAT -->
  <line x1="600" y1="474" x2="600" y2="510" stroke="#334155" stroke-width="3"/>
  <rect x="290" y="510" width="620" height="110" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="600" y="536" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Kernel routing + firewall + NAT (added by hand)</text>
  <text x="600" y="558" text-anchor="middle" font-size="13" fill="#111827">net.ipv4.ip_forward = 1</text>
  <text x="600" y="580" text-anchor="middle" font-size="13" fill="#111827">iptables FORWARD -i br-study / -o br-study -j ACCEPT  (Docker's FORWARD policy is DROP)</text>
  <text x="600" y="602" text-anchor="middle" font-size="13" fill="#111827">iptables -t nat POSTROUTING -s 10.0.0.0/24 -o enp45s0 -j MASQUERADE</text>

  <line x1="600" y1="620" x2="600" y2="650" stroke="#334155" stroke-width="3"/>
  <rect x="460" y="650" width="280" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="600" y="672" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">enp45s0 (host uplink)</text>
  <text x="600" y="694" text-anchor="middle" font-size="13" fill="#111827">192.168.1.220</text>

  <!-- path note -->
  <text x="50" y="650" font-size="13" font-weight="bold" fill="#c2410c">Outbound path (ping 8.8.8.8):</text>
  <text x="50" y="672" font-size="12" fill="#111827">blue veth-b → veth pair → br-study</text>
  <text x="50" y="692" font-size="12" fill="#111827">→ FORWARD accept → MASQUERADE</text>
  <text x="50" y="712" font-size="12" fill="#111827">→ enp45s0 → router → Internet</text>

  <!-- break/fix note -->
  <text x="780" y="666" font-size="13" font-weight="bold" fill="#b91c1c">Exercise 4 break/fix:</text>
  <text x="780" y="688" font-size="12" fill="#111827">br-study DOWN → red ↔ blue fails,</text>
  <text x="780" y="708" font-size="12" fill="#111827">veth ends still UP + attached</text>

  <!-- outside -->
  <line x1="600" y1="706" x2="600" y2="780" stroke="#334155" stroke-width="3"/>
  <rect x="470" y="780" width="260" height="56" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="600" y="804" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Home router</text>
  <text x="600" y="824" text-anchor="middle" font-size="13" fill="#111827">192.168.1.1</text>
  <line x1="730" y1="808" x2="870" y2="808" stroke="#334155" stroke-width="3"/>
  <rect x="870" y="780" width="240" height="56" rx="28" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="990" y="804" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Internet</text>
  <text x="990" y="824" text-anchor="middle" font-size="13" fill="#111827">8.8.8.8 (ping OK, ~14 ms)</text>

  <text x="1160" y="886" text-anchor="end" font-size="11" fill="#6b7280">KubeCraft clab lesson 00 · captured 2026-10-03 · diagram drawn with Claude (AI-assisted)</text>
</svg>
