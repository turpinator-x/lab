<text x="500" y="615" font-size="13" font-weight="bold" fill="#334155">10.20.2.0/24</text>
<text x="500" y="560" font-size="11" fill="#6b7280">e1-1 .1</text>
<text x="500" y="672" font-size="11" fill="#6b7280">.2</text>
<line x1="810" y1="540" x2="810" y2="680" stroke="#334155" stroke-width="3"/>
<text x="820" y="615" font-size="13" font-weight="bold" fill="#334155">10.20.3.0/24</text>
<text x="820" y="560" font-size="11" fill="#6b7280">e1-1 .1</text>
<text x="820" y="672" font-size="11" fill="#6b7280">.2</text>
