<text x="1120" y="615" font-size="13" font-weight="bold" fill="#334155">10.20.4.0/24</text>
<text x="1120" y="560" font-size="11" fill="#6b7280">e1-1 .1</text>
<text x="1120" y="672" font-size="11" fill="#6b7280">.2</text>
<rect x="270" y="95" width="300" height="110" rx="12" fill="#f0fdf4" stroke="#2563eb" stroke-width="2.5"/>
<text x="420" y="125" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">spine1</text>
<text x="420" y="148" text-anchor="middle" font-size="13" fill="#111827">AS 65000 (shared) · router-id 10.0.1.1</text>
<text x="420" y="170" text-anchor="middle" font-size="12" fill="#374151">e1-1..e1-4 → leaf1..leaf4</text>
<text x="420" y="190" text-anchor="middle" font-size="12" fill="#374151">10.10.1.0 / .2 / .4 / .6 (/31)</text>
<rect x="730" y="95" width="300" height="110" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2.5"/>
<text x="880" y="125" text-anchor="middle" font-size="18" font-weight="bold" fill="#059669">spine2</text>
<text x="880" y="148" text-anchor="middle" font-size="13" fill="#111827">AS 65000 (shared) · router-id 10.0.1.2</text>
<text x="880" y="170" text-anchor="middle" font-size="12" fill="#374151">e1-1..e1-4 → leaf1..leaf4</text>
<text x="880" y="190" text-anchor="middle" font-size="12" fill="#374151">10.10.2.0 / .2 / .4 / .6 (/31)</text>
<rect x="65" y="430" width="250" height="110" rx="12" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="190" y="458" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">leaf1</text>
<text x="190" y="479" text-anchor="middle" font-size="12" fill="#111827">AS 65001 · router-id 10.0.2.1</text>
<text x="190" y="500" text-anchor="middle" font-size="12" fill="#2563eb">e1-49 → spine1 10.10.1.1/31</text>
<text x="190" y="520" text-anchor="middle" font-size="12" fill="#059669">e1-50 → spine2 10.10.2.1/31</text>
<rect x="365" y="430" width="250" height="110" rx="12" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="490" y="458" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">leaf2</text>
<text x="490" y="479" text-anchor="middle" font-size="12" fill="#111827">AS 65002 · router-id 10.0.2.2</text>
<text x="490" y="500" text-anchor="middle" font-size="12" fill="#2563eb">e1-49 → spine1 10.10.1.3/31</text>
<text x="490" y="520" text-anchor="middle" font-size="12" fill="#059669">e1-50 → spine2 10.10.2.3/31</text>
<rect x="685" y="430" width="250" height="110" rx="12" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="810" y="458" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">leaf3</text>
<text x="810" y="479" text-anchor="middle" font-size="12" fill="#111827">AS 65003 · router-id 10.0.2.3</text>
<text x="810" y="500" text-anchor="middle" font-size="12" fill="#2563eb">e1-49 → spine1 10.10.1.5/31</text>
<text x="810" y="520" text-anchor="middle" font-size="12" fill="#059669">e1-50 → spine2 10.10.2.5/31</text>
<rect x="985" y="430" width="250" height="110" rx="12" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.2"/>
<text x="1110" y="458" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">leaf4</text>
<text x="1110" y="479" text-anchor="middle" font-size="12" fill="#111827">AS 65004 · router-id 10.0.2.4</text>
<text x="1110" y="500" text-anchor="middle" font-size="12" fill="#2563eb">e1-49 → spine1 10.10.1.7/31</text>
<text x="1110" y="520" text-anchor="middle" font-size="12" fill="#059669">e1-50 → spine2 10.10.2.7/31</text>
<rect x="100" y="680" width="180" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="190" y="708" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">host1</text>
<text x="190" y="730" text-anchor="middle" font-size="12" fill="#111827">10.20.1.2 · gw .1</text>
<rect x="400" y="680" width="180" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="490" y="708" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">host2</text>
<text x="490" y="730" text-anchor="middle" font-size="12" fill="#111827">10.20.2.2 · gw .1</text>
<rect x="720" y="680" width="180" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="810" y="708" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">host3</text>
<text x="810" y="730" text-anchor="middle" font-size="12" fill="#111827">10.20.3.2 · gw .1</text>
<rect x="1020" y="680" width="180" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="1110" y="708" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">host4</text>
<text x="1110" y="730" text-anchor="middle" font-size="12" fill="#111827">10.20.4.2 · gw .1</text>
<rect x="40" y="775" width="1220" height="100" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="60" y="800" font-size="13" font-weight="bold" fill="#9a3412">ECMP:</text>
<text x="120" y="800" font-size="13" fill="#111827">leaf1 → host4 (10.20.4.0/24) has two equal-cost paths: via spine1 and via spine2, both with AS path [65000, 65004]. Traffic is shared across both.</text>
<text x="60" y="824" font-size="13" font-weight="bold" fill="#9a3412">Loop prevention:</text>
<text x="190" y="824" font-size="13" fill="#111827">spines share AS 65000, so a route a leaf re-advertises upward is rejected by the other spine (65000 already in the AS path).</text>
<text x="60" y="848" font-size="13" font-weight="bold" fill="#9a3412">/31 links:</text>
<text x="145" y="848" font-size="13" fill="#111827">2 addresses per link (RFC 3021), no network/broadcast waste. Spine side = even (.0, .2 …), leaf side = odd (.1, .3 …).</text>
<text x="1260" y="893" text-anchor="end" font-size="11" fill="#6b7280">KubeCraft clab lesson 05 · drawn with Claude (AI-assisted)</text>
</svg>