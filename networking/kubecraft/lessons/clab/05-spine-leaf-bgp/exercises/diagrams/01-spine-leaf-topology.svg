<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1300" height="900" fill="#ffffff"/>
<text x="650" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">Lesson 05: 3-stage folded Clos (2 spines + 4 leaves), eBGP per RFC 7938</text>
<text x="650" y="64" text-anchor="middle" font-size="14" fill="#4b5563">Every leaf connects to every spine. No leaf-leaf or spine-spine links. All fabric links are /31 point-to-point.</text>
<line x1="420" y1="205" x2="160" y2="430" stroke="#2563eb" stroke-width="2.5" opacity="0.85"/>
<line x1="420" y1="205" x2="460" y2="430" stroke="#2563eb" stroke-width="2.5" opacity="0.85"/>
<line x1="420" y1="205" x2="780" y2="430" stroke="#2563eb" stroke-width="2.5" opacity="0.85"/>
<line x1="420" y1="205" x2="1080" y2="430" stroke="#2563eb" stroke-width="2.5" opacity="0.85"/>
<line x1="880" y1="205" x2="220" y2="430" stroke="#059669" stroke-width="2.5" opacity="0.85"/>
<line x1="880" y1="205" x2="520" y2="430" stroke="#059669" stroke-width="2.5" opacity="0.85"/>
<line x1="880" y1="205" x2="840" y2="430" stroke="#059669" stroke-width="2.5" opacity="0.85"/>
<line x1="880" y1="205" x2="1140" y2="430" stroke="#059669" stroke-width="2.5" opacity="0.85"/>
<line x1="190" y1="540" x2="190" y2="680" stroke="#334155" stroke-width="3"/>
