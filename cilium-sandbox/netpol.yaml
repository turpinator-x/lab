apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-labelled
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: "true"
      ports:
        - protocol: TCP
          port: 80
